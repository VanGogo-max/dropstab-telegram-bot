version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: cryptobot_db
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: changeme123
      POSTGRES_DB: cryptobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cryptobot_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: cryptobot_backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://cryptobot:changeme123@postgres:5432/cryptobot
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
